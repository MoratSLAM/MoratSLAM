ratslam_view_template:
  ros__parameters:
    # Camera resolution -> x = 640 / y = 480
    image_crop_y_max: 330
    image_crop_y_min: 75
    template_x_size: 60
    template_y_size: 20
    vt_shift_match: 10
    vt_step_match: 2
    vt_match_threshold: 0.040
    # draw
    enable: false
    vt_window_width: 416
    vt_window_height: 480

ratslam_pose_cells:
  ros__parameters:
    pc_dim_xy: 20
    pc_vt_inject_energy: 0.15
    pc_cell_x_size: 0.3
    exp_delta_pc_threshold: 1.0
    # draw
    enable: false

ratslam_experience_map:
  ros__parameters:
    exp_loops: 80
    exp_initial_em_deg: 221.96
    # draw
    enable: true
