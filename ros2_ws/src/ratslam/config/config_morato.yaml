ratslam_view_template:
  ros__parameters:
    # x = 640 / y = 480
    image_crop_y_max: 330
    image_crop_y_min: 75
    template_x_size: 60 # esses valores sao a resolucao depois da compressao da imagem quando vira view template?
    template_y_size: 20
    vt_shift_match: 10 # permite deslize lateral com a imagem para tentar encontrar padroes
    vt_step_match: 2 # Passo dados para testar os desvios laterais - Ex: step = 1, shift = 4 -> vai dar um passo pra cada pixel ate chegar em 4, ou seja, vai dar 4 passos
    vt_match_threshold: 0.040 #0.05
    # draw
    enable: false
    vt_window_width: 416
    vt_window_height: 480

ratslam_pose_cells:
  ros__parameters:
    pc_dim_xy: 20
    pc_vt_inject_energy: 0.15 # Esse parametro esta relacionado ao quanto de energia eh injetada quando se reconhece um template? Como sabemos qual o melhor valor aqui?
    # Pacote de energia se move 1 celula por iteracao
    pc_cell_x_size: 0.3 # Vmedia = 1.2 m/s - Freq Odom = 4Hz --> DeltaT = 1/4 = 0.25s (por iteracao) --> DeltaX = 1.2 * 0.25 = 0.3m (por iteracao) --> Adicionar na metodologia sobre os ajustes de parametro
    exp_delta_pc_threshold: 1.0 # Nao entendi esse - Raio (em unidades de pose cells) que determina quando uma experiencia sera criada apos o shifht do pacote de ativacao
    # draw
    enable: false

ratslam_experience_map:
  ros__parameters:
    exp_loops: 80
    exp_initial_em_deg: 270.0
    # draw
    enable: false